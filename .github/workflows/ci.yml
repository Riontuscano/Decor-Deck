name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run check

      - name: Smoke test
        run: |
          PORT=3000 node server.js &
          for i in $(seq 1 20); do curl -sf http://localhost:3000/ping && break; sleep 1; done
          curl -sf http://localhost:3000/ > /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/api/chat -H 'Content-Type: application/json' -d '{}')" = 400
